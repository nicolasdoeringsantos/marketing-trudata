<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TruData — Central de Publicações da Semana (18/09 a 24/09/2026)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg: #070b14;
      --card-bg: #0f172a;
      --primary: #009fe3;
    }
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    h1, h2, h3, .font-heading { font-family: 'Outfit', sans-serif; }
    body { background-color: var(--bg); color: #f8fafc; }
    .toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: #10b981; color: #fff; font-weight: 700;
      padding: 0.75rem 1.25rem; border-radius: 0.75rem;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
      display: none; z-index: 100;
    }
    .toast.show { display: flex; align-items: center; gap: 0.5rem; animation: slideUp 0.3s ease-out; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

  <div id="toast" class="toast">
    <span>✅</span> <span id="toast-text">Texto copiado para a área de transferência!</span>
  </div>

  <!-- TOPO & NAVEGAÇÃO -->
  <div class="max-w-7xl mx-auto mb-6 flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-6">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-2xl shadow-lg shadow-sky-500/20">
        📢
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold uppercase tracking-wider text-sky-400 bg-sky-950/60 px-2.5 py-0.5 rounded-full border border-sky-800/50">Calendário Tático da Semana</span>
          <span class="text-xs text-slate-400">18 a 24 de Setembro de 2026</span>
        </div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-white">Central de Publicações & Redes Sociais</h1>
      </div>
    </div>

    <div class="flex items-center gap-2.5 flex-wrap">
      <a href="https://business.facebook.com" target="_blank" class="px-4 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-blue-600/20 transition flex items-center gap-2">
        🚀 Meta Business Suite ↗
      </a>
      <a href="teleprompter.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-purple-300 text-xs font-bold rounded-xl border border-slate-700 transition flex items-center gap-2">
        🎙️ Teleprompter de Gravação
      </a>
      <a href="stories.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl border border-slate-700 transition flex items-center gap-2">
        📱 Stories 9:16 (52 Artes)
      </a>
      <a href="index.html" class="px-3.5 py-2 bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-white text-xs font-bold rounded-xl transition">
        ← Hub
      </a>
    </div>
  </div>

  <!-- GRID DE POSTAGENS DOS 7 DIAS -->
  <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="grid-posts">
    <!-- Injetado dinamicamente -->
  </div>

  <script>
    let POSTS = [];

    async function carregarPosts() {
      try {
        const res = await fetch('planejamento_semana_dados.json');
        POSTS = await res.json();
        renderizarPosts(POSTS);
      } catch (e) {
        console.error("Erro ao carregar posts:", e);
      }
    }

    function mostrarToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toast-text').innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function copiarTexto(txt) {
      navigator.clipboard.writeText(txt).then(() => {
        mostrarToast('Legenda e hashtags copiadas com sucesso!');
      });
    }

    function renderizarPosts(lista) {
      const grid = document.getElementById('grid-posts');
      grid.innerHTML = '';

      lista.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = "bg-slate-900/90 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between hover:border-slate-700 transition shadow-xl";
        
        card.innerHTML = `
          <div>
            <!-- TOPO DO CARD -->
            <div class="flex items-center justify-between gap-2 mb-3">
              <span class="text-xs font-bold text-sky-400 bg-sky-950/60 border border-sky-800/40 px-2.5 py-0.5 rounded-full">${p.data}</span>
              <span class="text-[11px] font-bold text-slate-400 bg-slate-800 px-2 py-0.5 rounded-md">${p.formato}</span>
            </div>

            <h3 class="text-lg font-black text-white leading-snug mb-2">${p.tema}</h3>
            <span class="text-xs text-indigo-400 font-semibold block mb-3">📌 Pilar: ${p.pilar}</span>

            <!-- PREVIEW DA LEGENDA -->
            <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3.5 mb-4 max-h-48 overflow-y-auto text-xs text-slate-300 leading-relaxed font-sans whitespace-pre-line select-all">
              ${p.legenda}
            </div>

            <!-- STORY DE APOIO -->
            <div class="bg-purple-950/20 border border-purple-800/30 rounded-xl p-3 mb-4 text-xs text-purple-200">
              <strong class="text-purple-400 block mb-1 text-[11px] uppercase tracking-wider">📱 Story Interativo do Dia:</strong>
              "${p.story_do_dia}"
            </div>
          </div>

          <!-- BOTÕES DE AÇÃO -->
          <div class="flex items-center gap-2 pt-3 border-t border-slate-800/60">
            <button onclick="copiarTexto(\`${p.legenda.replace(/`/g, "\\`").replace(/\\/g, "\\\\")}\`)" class="flex-1 py-2 bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs rounded-xl shadow-md shadow-sky-600/20 transition flex items-center justify-center gap-1.5">
              📋 Copiar Legenda
            </button>
            <a href="https://business.facebook.com" target="_blank" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-xl border border-slate-700 transition" title="Agendar no Meta Business Suite">
              Agendar ↗
            </a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    document.addEventListener('DOMContentLoaded', carregarPosts);
  </script>
</body>
</html>
