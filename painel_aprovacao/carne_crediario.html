<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Carnês & Crediário Pix — TruData ERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { azure: '#0070f3', hover: '#005bb5', dark: '#0b0f19', card: '#131b2e' } },
          fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Outfit', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
        }
      }
    }
  </script>
  <style>
    body { background-color: #080c14; color: #f1f5f9; }
    .glass { background: rgba(19, 27, 46, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    @media print {
      body { background: white !important; color: black !important; }
      header, .no-print { display: none !important; }
      .carne-impressao { border: 2px dashed #333 !important; background: white !important; color: black !important; page-break-inside: avoid; }
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased flex flex-col">

  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-40 no-print">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="text-xs text-slate-400 hover:text-white flex items-center gap-1 transition">
        ← Voltar ao Hub Central
      </a>
      <div class="flex items-center gap-2">
        <button onclick="window.print()" class="px-3 py-1.5 bg-brand-azure hover:bg-brand-hover text-white text-xs font-bold rounded-lg transition flex items-center gap-1.5">
          🖨️ Imprimir Carnê A4
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-10 flex-1 w-full space-y-8">
    <div class="glass rounded-3xl p-6 sm:p-8 shadow-2xl no-print">
      <div class="flex items-center gap-3 mb-4">
        <div class="h-10 w-10 rounded-xl bg-teal-500/20 text-teal-400 flex items-center justify-center text-xl border border-teal-500/30">
          📑
        </div>
        <div>
          <h1 class="text-2xl font-black font-display text-white">Demonstrador de Crediário Próprio & Carnê com Pix</h1>
          <p class="text-xs text-slate-400">Gere parcelas com código Pix dinâmico integrado para lojas de moda, calçados e materiais de construção.</p>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
        <div>
          <label class="text-[11px] text-slate-400 font-semibold block mb-1">Nome do Cliente:</label>
          <input type="text" id="carne-cliente" value="João da Silva" oninput="gerarCarnes()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
        </div>
        <div>
          <label class="text-[11px] text-slate-400 font-semibold block mb-1">Valor Total da Compra (R$):</label>
          <input type="number" id="carne-valor" value="450" oninput="gerarCarnes()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
        </div>
        <div>
          <label class="text-[11px] text-slate-400 font-semibold block mb-1">Qtd de Parcelas:</label>
          <input type="number" id="carne-parcelas" value="3" min="1" max="12" oninput="gerarCarnes()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
        </div>
        <div>
          <label class="text-[11px] text-slate-400 font-semibold block mb-1">Data 1ª Parcela:</label>
          <input type="date" id="carne-data" value="2026-10-10" oninput="gerarCarnes()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
        </div>
      </div>
    </div>

    <!-- ÁREA DE RENDERIZAÇÃO DOS CARNÊS -->
    <div id="container-carnes" class="space-y-4">
      <!-- Inserido dinamicamente via JS -->
    </div>
  </main>

  <script>
    function gerarCarnes() {
      const cliente = document.getElementById('carne-cliente').value || 'Cliente Exemplo';
      const valorTotal = parseFloat(document.getElementById('carne-valor').value) || 0;
      const qtdParcelas = parseInt(document.getElementById('carne-parcelas').value) || 1;
      const dataInicio = new Date(document.getElementById('carne-data').value || '2026-10-10');

      const valorParcela = (valorTotal / qtdParcelas).toFixed(2);
      const container = document.getElementById('container-carnes');
      container.innerHTML = '';

      for (let i = 1; i <= qtdParcelas; i++) {
        const vcto = new Date(dataInicio);
        vcto.setMonth(vcto.getMonth() + (i - 1));
        const dataFormatada = vcto.toLocaleDateString('pt-BR');

        const card = document.createElement('div');
        card.className = "carne-impressao glass rounded-2xl p-5 border border-slate-800 shadow-xl flex flex-col sm:flex-row items-center justify-between gap-6";
        card.innerHTML = `
          <div class="flex-1 space-y-2 text-left w-full">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
              <span class="text-xs font-black text-brand-azure font-display uppercase tracking-wider">LOJA MODELO · TRUDATA ERP</span>
              <span class="text-xs font-bold font-mono text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded">PARCELA ${i}/${qtdParcelas}</span>
            </div>
            <div class="grid grid-cols-2 gap-2 text-xs">
              <div>
                <span class="text-slate-400 block text-[10px]">CLIENTE / SACADO:</span>
                <strong class="text-white">${cliente}</strong>
              </div>
              <div>
                <span class="text-slate-400 block text-[10px]">VENCIMENTO:</span>
                <strong class="text-amber-400 font-mono">${dataFormatada}</strong>
              </div>
            </div>
            <div class="pt-2 text-[10px] text-slate-500">
              * Pagamento pontual garante limite liberado nas próximas compras.
            </div>
          </div>

          <div class="flex items-center gap-4 shrink-0 bg-slate-950/80 p-3.5 rounded-xl border border-slate-800 text-center">
            <div>
              <span class="text-[10px] text-slate-400 uppercase font-mono block">VALOR A PAGAR</span>
              <span class="text-xl font-black text-white font-mono">R$ ${parseFloat(valorParcela).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</span>
              <span class="text-[9px] text-emerald-400 block mt-1">Pague via Pix na hora</span>
            </div>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=90x90&data=Pix-TruData-ERP-Demonstrativo-${i}" class="w-20 h-20 bg-white p-1 rounded-lg" alt="QR Code Pix" />
          </div>
        `;
        container.appendChild(card);
      }
    }

    gerarCarnes();
  </script>
</body>
</html>
